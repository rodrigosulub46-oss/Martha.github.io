
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postres Martha Euan</title>
<style>
body {
  margin: 0;
  padding: 25px 12px;
  text-align: center;
  font-family: Arial, sans-serif;
  background: #fff0a8;
  color: #914d63;
}
header, .info, .flan {
  background: #fffaf5;
  border: 2px solid #efb0c5;
  border-radius: 22px;
  padding: 20px;
  margin: 15px auto;
  max-width: 600px;
}
h1 { color: #b64f78; }
h2 { color: #c76c8e; font-size: 18px; }
.info p { font-size: 20px; font-weight: bold; }
.postres {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}
.flan { flex: 1 1 220px; }
.dibujo { font-size: 90px; margin: 15px; }
.flores { color: #e78fb0; font-size: 28px; }
</style>
</head>
<body>
<header>
  <div class="flores">✿ ❀ ✿</div>
  <h1>Postres Martha Euan</h1>
  <p>♡ Un dulce detalle para ti ♡</p>
</header>

<section class="info">
  <h2>Mi TikTok</h2>
  <p>Martha Euan</p>
  <h2>Mi número</h2>
  <p>999 530 9290</p>
</section>

<div class="postres">
  <section class="flan">
    <div class="flores">✿ ❀</div>
    <div class="dibujo">🍮</div>
    <h2>Flan casero</h2>
  </section>
  <section class="flan">
    <div class="flores">❀ ✿</div>
    <div class="dibujo">🍮</div>
    <h2>Hecho con cariño</h2>
  </section>
</div>
<p class="flores">♡ Gracias por tu visita ♡</p>
</body>
</html>
